<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اخبار هوش مصنوعی</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>اخبار هوش مصنوعی</h1>
  <input id="search-input" placeholder="جستجو..." />
  <button id="search-btn">جستجو</button>
</header>

<div id="categories">
  <button onclick="filterByTopic('robotics')">رباتیک</button>
  <button onclick="filterByTopic('healthcare ai')">پزشکی</button>
  <button onclick="filterByTopic('education ai')">آموزش</button>
  <button onclick="filterByTopic('creative ai')">خلاقیت</button>
</div>

<main>
  <div id="news-container"></div>
  <button id="load-more">نمایش بیشتر</button>
</main>

<section>
  <h2>ارسال نظر</h2>
  <form id="comment-form">
    <input id="name" placeholder="نام" required />
    <textarea id="text" placeholder="نظر..." required></textarea>
    <button>ارسال</button>
  </form>
  <div id="comments"></div>
</section>

<script src="script.js"></script>
</body>
</html>
